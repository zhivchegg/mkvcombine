<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EA580C"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Film strip left -->
  <g fill="#fff" opacity="0.95">
    <rect x="100" y="80" width="60" height="352" rx="8" fill="none" stroke="#fff" stroke-width="16"/>
    <rect x="112" y="100" width="36" height="28" rx="4"/>
    <rect x="112" y="148" width="36" height="28" rx="4"/>
    <rect x="112" y="196" width="36" height="28" rx="4"/>
    <rect x="112" y="288" width="36" height="28" rx="4"/>
    <rect x="112" y="336" width="36" height="28" rx="4"/>
    <rect x="112" y="384" width="36" height="28" rx="4"/>
  </g>
  <!-- Film strip right -->
  <g fill="#fff" opacity="0.95">
    <rect x="352" y="80" width="60" height="352" rx="8" fill="none" stroke="#fff" stroke-width="16"/>
    <rect x="364" y="100" width="36" height="28" rx="4"/>
    <rect x="364" y="148" width="36" height="28" rx="4"/>
    <rect x="364" y="196" width="36" height="28" rx="4"/>
    <rect x="364" y="288" width="36" height="28" rx="4"/>
    <rect x="364" y="336" width="36" height="28" rx="4"/>
    <rect x="364" y="384" width="36" height="28" rx="4"/>
  </g>
  <!-- Center merge arrows -->
  <g fill="#fff">
    <!-- Left arrow pointing right -->
    <path d="M200 220 L256 256 L200 292 Z"/>
    <!-- Right arrow pointing left -->
    <path d="M312 220 L256 256 L312 292 Z"/>
    <!-- Center circle -->
    <circle cx="256" cy="256" r="24" fill="url(#bg)" stroke="#fff" stroke-width="8"/>
  </g>
  <!-- Plus signs on film strips -->
  <g fill="#fff" opacity="0.6">
    <text x="130" y="272" font-family="Arial,sans-serif" font-size="48" font-weight="bold" text-anchor="middle">+</text>
    <text x="382" y="272" font-family="Arial,sans-serif" font-size="48" font-weight="bold" text-anchor="middle">+</text>
  </g>
</svg>
