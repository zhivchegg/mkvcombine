<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EA580C"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Film strip background -->
  <g fill="none" stroke="#fff" stroke-width="16" opacity="0.25">
    <rect x="80" y="30" width="352" height="452" rx="14"/>
  </g>
  <!-- Film perforations left -->
  <g fill="#fff" opacity="0.25">
    <rect x="90" y="50" width="40" height="48" rx="7"/>
    <rect x="90" y="118" width="40" height="48" rx="7"/>
    <rect x="90" y="186" width="40" height="48" rx="7"/>
    <rect x="90" y="254" width="40" height="48" rx="7"/>
    <rect x="90" y="322" width="40" height="48" rx="7"/>
    <rect x="90" y="390" width="40" height="48" rx="7"/>
  </g>
  <!-- Film perforations right -->
  <g fill="#fff" opacity="0.25">
    <rect x="382" y="50" width="40" height="48" rx="7"/>
    <rect x="382" y="118" width="40" height="48" rx="7"/>
    <rect x="382" y="186" width="40" height="48" rx="7"/>
    <rect x="382" y="254" width="40" height="48" rx="7"/>
    <rect x="382" y="322" width="40" height="48" rx="7"/>
    <rect x="382" y="390" width="40" height="48" rx="7"/>
  </g>
  <!-- Film frames -->
  <g fill="#fff" opacity="0.12">
    <rect x="145" y="50" width="222" height="48" rx="6"/>
    <rect x="145" y="118" width="222" height="48" rx="6"/>
    <rect x="145" y="186" width="222" height="48" rx="6"/>
    <rect x="145" y="254" width="222" height="48" rx="6"/>
    <rect x="145" y="322" width="222" height="48" rx="6"/>
    <rect x="145" y="390" width="222" height="48" rx="6"/>
  </g>

  <!-- Plus sign (top center) -->
  <g fill="#fff" opacity="0.95">
    <rect x="222" y="100" width="68" height="20" rx="10"/>
    <rect x="246" y="76" width="20" height="68" rx="10"/>
  </g>

  <!-- Speaker + waves group — shifted +25px -->
  <g fill="#fff" opacity="0.95">
    <!-- Speaker cabinet -->
    <rect x="108" y="235" width="60" height="110" rx="12"/>
    <!-- Speaker cone -->
    <path d="M168 235 L273 185 L273 395 L168 345 Z"/>
    <!-- Dust cap -->
    <ellipse cx="198" cy="290" rx="16" ry="24" fill="url(#bg)"/>
  </g>

  <!-- Sound waves -->
  <g fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity="0.8">
    <path d="M288 210 Q331 290 288 370"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" opacity="0.55">
    <path d="M316 185 Q365 290 316 395"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0.35">
    <path d="M340 162 Q393 290 340 418"/>
  </g>
</svg>
